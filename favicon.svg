  <title
     id="title1">Diglot icon, white tile with a blue right half</title>
  <desc
     id="desc1">A white rounded square. The left half holds a blue letter A. The right half is a darker blue rounded panel that starts at the center line and is framed by the white border, holding a white character 文. Shown on its own, on a light card and on a dark card.</desc>
